datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5432/orbit`}
    username: ${JDBC_USER:orbit}
    password: ${JDBC_PASSWORD:local-development-only}
    driverClassName: org.postgresql.Driver
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true

orbit:
  catalog:
    models: [gpt-5]
    tools: [search]
    resource-profiles: [SMALL, MEDIUM, LARGE, XL]
